name: Build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: endergfx-windows
          - os: ubuntu-latest
            artifact: endergfx-linux
          - os: macos-latest
            artifact: endergfx-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wayland-protocols libwayland-dev libxkbcommon-dev \
            libgl1-mesa-dev libx11-dev libxext-dev

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ matrix.os }}-deps-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: >
          cmake -B build -S .
          -DENDERGFX_FETCH_SDL3=ON
          -DENDERGFX_FETCH_BGFX=ON
          -DENDERGFX_FETCH_TINYOBJLOADER=ON
          -DENDERGFX_BUILD_EXAMPLES=ON
          -DENDERGFX_INSTALL=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Package
        shell: bash
        run: |
          mkdir -p package/{bin,lib}

          if [ -d build/bin ]; then
            cp -r build/bin/* package/bin/ 2>/dev/null || true
          fi
          if [ -d build/Release ]; then
            cp -r build/Release/* package/bin/ 2>/dev/null || true
          fi
          if [ -d build/bin/Release ]; then
            cp -r build/bin/Release/* package/bin/ 2>/dev/null || true
          fi
          if [ -d build/lib ]; then
            cp -r build/lib/* package/lib/ 2>/dev/null || true
          fi
          if [ -d build/Release ]; then
            find build/Release -maxdepth 1 \( -name "*.lib" -o -name "*.a" -o -name "*.dll" -o -name "*.so" \) -exec cp {} package/lib/ \; 2>/dev/null || true
          fi
          if [ -d build/lib/Release ]; then
            cp -r build/lib/Release/* package/lib/ 2>/dev/null || true
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package/
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          cd artifacts
          for dir in */; do
            name=$(basename "$dir")
            zip -r "${name}.zip" "$name"
          done
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
